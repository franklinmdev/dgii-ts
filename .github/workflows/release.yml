name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Audita solo dependencias de producción: la librería no trae deps en
      # runtime, así un CVE en una herramienta de desarrollo (vitest, etc.)
      # no bloquea una publicación que no lo incluye.
      - run: npm audit --omit=dev --audit-level=high

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm-publish
    # Serializa SOLO la publicación: un push a main y el evento `release`
    # del mismo commit comparten este grupo constante, así nunca corren dos
    # `npm publish` a la vez para la misma versión. cancel-in-progress:false
    # los encola en vez de cancelarlos. Los jobs de test siguen en paralelo.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Publish only when package.json's version isn't already on npm, so an
      # ordinary push to main is a no-op and only a version bump triggers a
      # release. Idempotent: re-running never republishes the same version.
      - id: version
        run: |
          LOCAL="$(node -p "require('./package.json').version")"
          echo "Versión local: dgii-ts@${LOCAL}"
          # No usar el código de salida como único indicador: `npm view`
          # devuelve no-cero tanto cuando la versión no existe (E404, hay
          # que publicar) como ante un fallo de registro/red. Distinguir
          # ambos: una versión faltante trae E404 en stderr; cualquier otro
          # fallo aborta el step (exit 1) en vez de intentar una publicación
          # que la npm rechazaría con 403 y dejaría el job en rojo.
          set +e
          REMOTE="$(npm view "dgii-ts@${LOCAL}" version 2>/tmp/npm-view-err.txt)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] && [ -n "$REMOTE" ]; then
            echo "dgii-ts@${LOCAL} ya está publicado — se omite."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' /tmp/npm-view-err.txt; then
            echo "dgii-ts@${LOCAL} es nuevo — se publicará."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view falló por un motivo distinto a E404 (¿registro caído o problema de red?). No se publica para evitar un intento erróneo."
            cat /tmp/npm-view-err.txt
            exit 1
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
